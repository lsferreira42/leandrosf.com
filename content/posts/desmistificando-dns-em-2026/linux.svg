<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Caminho de uma resolução de nome no Linux, da aplicação até o resolvedor recursivo">
<defs><marker id="seta-linux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fraco"/></marker></defs>
<rect class="azul" x="250" y="10" width="220" height="44" rx="8"/><text x="360.0" y="30.0" text-anchor="middle" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">getaddrinfo()</text><text class="fraco" x="360.0" y="46.0" text-anchor="middle" font-size="10.5">curl, navegador, a sua aplicação</text>
<path class="linha" d="M360,54 L360,84" marker-end="url(#seta-linux)"/>
<rect class="caixa" x="250" y="86" width="220" height="44" rx="8"/><text x="360.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600">NSS da glibc</text><text class="fraco" x="360.0" y="122.0" text-anchor="middle" font-size="10.5">/etc/nsswitch.conf, linha hosts:</text>
<path class="linha" d="M300,130 L130,168" marker-end="url(#seta-linux)"/>
<path class="linha" d="M360,130 L360,168" marker-end="url(#seta-linux)"/>
<path class="linha" d="M420,130 L590,168" marker-end="url(#seta-linux)"/>
<rect class="laranja" x="40" y="170" width="180" height="44" rx="8"/><text x="130.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">files</text><text class="fraco" x="130.0" y="206.0" text-anchor="middle" font-size="10.5">/etc/hosts</text>
<rect class="laranja" x="270" y="170" width="180" height="44" rx="8"/><text x="360.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">resolve</text><text class="fraco" x="360.0" y="206.0" text-anchor="middle" font-size="10.5">systemd-resolved via varlink/D-Bus</text>
<rect class="laranja" x="500" y="170" width="180" height="44" rx="8"/><text x="590.0" y="190.0" text-anchor="middle" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dns</text><text class="fraco" x="590.0" y="206.0" text-anchor="middle" font-size="10.5">lê o /etc/resolv.conf</text>
<path class="linha" d="M360,214 L360,254" marker-end="url(#seta-linux)"/>
<path class="linha" d="M590,214 L440,254" marker-end="url(#seta-linux)"/>
<rect class="verde" x="250" y="256" width="220" height="44" rx="8"/><text x="360.0" y="276.0" text-anchor="middle" font-size="13" font-weight="600">systemd-resolved</text><text class="fraco" x="360.0" y="292.0" text-anchor="middle" font-size="10.5">stub em 127.0.0.53, cache, DNS por link</text>
<path class="linha" d="M360,300 L360,338" marker-end="url(#seta-linux)"/>
<rect class="roxo" x="230" y="340" width="260" height="44" rx="8"/><text x="360.0" y="360.0" text-anchor="middle" font-size="13" font-weight="600">resolvedor recursivo</text><text class="fraco" x="360.0" y="376.0" text-anchor="middle" font-size="10.5">o do provedor, 1.1.1.1, o CoreDNS do cluster…</text>
<text class="fraco" x="40" y="250" font-size="11">achou aqui, para aqui</text>
<path class="linha" d="M130,214 L130,236" />
<text class="fraco" x="700" y="330" text-anchor="end" font-size="11">dig, host e nslookup pulam o NSS:</text>
