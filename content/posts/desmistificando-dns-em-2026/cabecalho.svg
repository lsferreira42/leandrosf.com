<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" role="img" aria-label="Os 12 bytes do cabeçalho de uma mensagem DNS">
<text class="fraco" x="60.0" y="18" text-anchor="middle" font-size="10">0</text>
<text class="fraco" x="100.0" y="18" text-anchor="middle" font-size="10">1</text>
<text class="fraco" x="140.0" y="18" text-anchor="middle" font-size="10">2</text>
<text class="fraco" x="180.0" y="18" text-anchor="middle" font-size="10">3</text>
<text class="fraco" x="220.0" y="18" text-anchor="middle" font-size="10">4</text>
<text class="fraco" x="260.0" y="18" text-anchor="middle" font-size="10">5</text>
<text class="fraco" x="300.0" y="18" text-anchor="middle" font-size="10">6</text>
<text class="fraco" x="340.0" y="18" text-anchor="middle" font-size="10">7</text>
<text class="fraco" x="380.0" y="18" text-anchor="middle" font-size="10">8</text>
<text class="fraco" x="420.0" y="18" text-anchor="middle" font-size="10">9</text>
<text class="fraco" x="460.0" y="18" text-anchor="middle" font-size="10">10</text>
<text class="fraco" x="500.0" y="18" text-anchor="middle" font-size="10">11</text>
<text class="fraco" x="540.0" y="18" text-anchor="middle" font-size="10">12</text>
<text class="fraco" x="580.0" y="18" text-anchor="middle" font-size="10">13</text>
<text class="fraco" x="620.0" y="18" text-anchor="middle" font-size="10">14</text>
<text class="fraco" x="660.0" y="18" text-anchor="middle" font-size="10">15</text>
<rect class="roxo" x="40" y="26" width="640" height="44" rx="4"/><text x="360.0" y="53.0" text-anchor="middle" font-size="12.5" font-weight="600">ID</text>
<rect class="vermelho" x="40" y="74" width="40" height="44" rx="4"/><text x="60.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">QR</text><rect class="vermelho" x="80" y="74" width="160" height="44" rx="4"/><text x="160.0" y="101.0" text-anchor="middle" font-size="12.5" font-weight="600">OPCODE</text><rect class="vermelho" x="240" y="74" width="40" height="44" rx="4"/><text x="260.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">AA</text><rect class="vermelho" x="280" y="74" width="40" height="44" rx="4"/><text x="300.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">TC</text><rect class="vermelho" x="320" y="74" width="40" height="44" rx="4"/><text x="340.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">RD</text><rect class="vermelho" x="360" y="74" width="40" height="44" rx="4"/><text x="380.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">RA</text><rect class="caixa" x="400" y="74" width="40" height="44" rx="4"/><text x="420.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">Z</text><rect class="verde" x="440" y="74" width="40" height="44" rx="4"/><text x="460.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">AD</text><rect class="verde" x="480" y="74" width="40" height="44" rx="4"/><text x="500.0" y="101.0" text-anchor="middle" font-size="10.5" font-weight="600">CD</text><rect class="laranja" x="520" y="74" width="160" height="44" rx="4"/><text x="600.0" y="101.0" text-anchor="middle" font-size="12.5" font-weight="600">RCODE</text>
<rect class="caixa" x="40" y="122" width="640" height="44" rx="4"/><text x="360.0" y="149.0" text-anchor="middle" font-size="12.5" font-weight="600">QDCOUNT: quantas perguntas</text>
<rect class="caixa" x="40" y="170" width="640" height="44" rx="4"/><text x="360.0" y="197.0" text-anchor="middle" font-size="12.5" font-weight="600">ANCOUNT: registros na resposta</text>
<rect class="caixa" x="40" y="218" width="640" height="44" rx="4"/><text x="360.0" y="245.0" text-anchor="middle" font-size="12.5" font-weight="600">NSCOUNT: registros de autoridade</text>
<rect class="caixa" x="40" y="266" width="640" height="44" rx="4"/><text x="360.0" y="293.0" text-anchor="middle" font-size="12.5" font-weight="600">ARCOUNT: registros adicionais</text>
<text class="fraco" x="40" y="330" font-size="11">16 bits por linha, 6 linhas: 12 bytes. Depois vêm a pergunta e as três seções de registros.</text>
</svg>