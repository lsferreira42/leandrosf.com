server {
    listen 9034;
    listen [::]:9034;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Turn off directory listing now that we've confirmed files exist
    autoindex off;

    # Set access and error logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        # Try to serve the requested URI, then as directory + index, then 404
        try_files $uri $uri/ =404;
    }

    # Serve static files with caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# Metrics for the nginx-prometheus-exporter sidecar in the same pod. A separate
# server on loopback, so stub_status is never reachable through the ingress.
server {
    listen 127.0.0.1:8081;
    server_name _;

    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
